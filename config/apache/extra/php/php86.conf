<IfDefine php86>
  Define EnablePHP
  PidFile "${SRVROOT}/logs/httpd.php86.pid"

  LoadFile "${PHPROOT}\php86\php8ts.dll"
  # PHP8.6以降、同梱OpenSSLが4系（libcrypto-4/libssl-4）となり、
  # Apache同梱のOpenSSL 3系（libcrypto-3/libssl-3）では依存解決できないため明示的に読み込む。
  # libpq/libssh2/libsasl/php_openssl等が依存するため、それらより先に読み込むこと。
  # DLL名がアーキテクチャで異なるため、存在する方を読み込む。
  <IfFile "${PHPROOT}\php86\libcrypto-4-x64.dll">
    LoadFile "${PHPROOT}\php86\libcrypto-4-x64.dll"
    LoadFile "${PHPROOT}\php86\libssl-4-x64.dll"
  </IfFile>
  <IfFile "${PHPROOT}\php86\libcrypto-4.dll">
    LoadFile "${PHPROOT}\php86\libcrypto-4.dll"
    LoadFile "${PHPROOT}\php86\libssl-4.dll"
  </IfFile>
  LoadFile "${PHPROOT}\php86\libpq.dll"
  # ssl
  LoadFile "${PHPROOT}\php86\libssh2.dll"
  # php_ldap依存
  LoadFile "${PHPROOT}\php86\libsasl.dll"
  # PHP7.4以降、sqlite3は別途読み込みが必要
  LoadFile "${PHPROOT}\php86\libsqlite3.dll"

  LoadModule php_module "${PHPROOT}\php86\php8apache2_4.dll"
  PHPIniDir "${PHPROOT}\php86"

  Include "${SRVROOT}\conf\extra\enable-php86\*.conf"
</IfDefine>
